# Year level groups and their classes for 2026.
# Classes are named alphabetically. Naming a class is fine; never name a student.
year: 2026
groups:
  - id: y1
    label: Year 1
    year_levels: [1]
    classes: [1A, 1B]
  - id: y2
    label: Year 2
    year_levels: [2]
    classes: [2A, 2B, 2C]
  - id: y34
    label: Year 3/4
    year_levels: [34]
    classes: [34A, 34B, 34C, 34D, 34E]   # [names to confirm]
  - id: y5
    label: Year 5
    year_levels: [5]
    classes: [5A, 5B, 5C]
  - id: y6
    label: Year 6
    year_levels: [6]
    classes: [6A, 6B]
